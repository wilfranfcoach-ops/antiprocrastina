<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activar</title>

<style>

   * {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🔥 CLAVE */
.card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  width: 100%;
  max-width: 420px;

  padding: 40px 25px;
  border-radius: 20px;
  text-align: center;

  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.1);
}
/* TITULO */
h1 {
  margin-bottom: 10px;
  font-size: 22px;
}

/* TEXTO */
p {
  opacity: 0.7;
  font-size: 14px;
  margin-bottom: 25px;
}

/* INPUT 🔥 MÁS GRANDE */
input {
  width: 100%;
  padding: 18px;
  border-radius: 12px;
  border: none;
  margin-bottom: 15px;
  font-size: 18px;
  outline: none;
  text-align: center;
}

/* BOTÓN */
button {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  transition: all 0.2s ease;
}

button:hover {
  transform: scale(1.03);
  box-shadow: 0 5px 20px rgba(99,102,241,0.5);
}

/* BADGE */
.badge {
  display: inline-block;
  background: rgba(255,255,255,0.15);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  margin-bottom: 15px;
}

/* 📱 MOBILE PRO */
@media (max-width: 600px) {

  .card {
    width: 100%;
    max-width: 100%;
    height: 100vh;
    border-radius: 0;
    padding: 40px 25px;
  }

  h1 {
    font-size: 32px;
  }

  p {
    font-size: 18px;
  }

  input {
    font-size: 24px;
    padding: 25px;
  }

  button {
    font-size: 22px;
    padding: 22px;
  }

}

</style>
</head>

<body>

  <div class="card">
    <div class="badge">✨ PRO</div>
    <h1>Activa tu acceso</h1>
    <p>Desbloquea todas las funciones premium</p>

    <input type="text" id="codigo" placeholder="Pega tu código aquí" />

    <button onclick="activar()">Activar acceso</button>
  </div>

  <script>
   async function activar() {
   const codigo = document.getElementById("codigo").value;

   const res = await fetch("/api/validar", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ codigo }),
  });

  const data = await res.json();

  if (data.ok) {
    localStorage.setItem("pro_activo", "true");
    window.location.href = "/pro";
  } else {
    alert("Código inválido");
  }
}  

  </script>

</body>
</html>
