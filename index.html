<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Activar PRO</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 320px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    p {
      opacity: 0.7;
      font-size: 14px;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 15px;
      font-size: 14px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      transition: all 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(99,102,241,0.5);
    }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="badge">✨ PRO</div>
    <h1>Activa tu acceso</h1>
    <p>Desbloquea todas las funciones premium</p>

    <input type="text" id="codigo" placeholder="Pega tu código aquí" />

    <button onclick="activar()">Activar acceso</button>
  </div>

  <script>
  async function activar() {
  try {
    const res = await fetch("/api/validar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ codigo }),
    });

    console.log("STATUS:", res.status);

    const data = await res.json();
    console.log("DATA:", data);

  } catch (error) {
    console.error("ERROR:", error);
  }
}
  </script>

</body>
</html>
